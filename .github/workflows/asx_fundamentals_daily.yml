name: ASX Fundamentals (Daily)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: rotate (default) refreshes a slice and merges cache; full tries all tickers."
        required: false
        default: "rotate"
        type: choice
        options: [rotate, full]
      summary_per_run:
        description: "How many tickers to refresh via quoteSummary each run (rotate mode). Default 220."
        required: false
        default: "220"
      concurrency:
        description: "Concurrent quoteSummary workers. Default 1 (safest against 429)."
        required: false
        default: "1"
      qs_rate_per_min:
        description: "Global quoteSummary request rate (req/min). Default 8. Lower = fewer 429s."
        required: false
        default: "8"
      min_success_rate:
        description: "Minimum ok-rate (based on attempted requests) to advance cursor. Default 0.30."
        required: false
        default: "0.30"
      fail_on_low_success:
        description: "Fail workflow if ok-rate below min_success_rate."
        required: false
        default: "true"
        type: choice
        options: ["true","false"]
      include_statements:
        description: "Also fetch annual statement modules (heavier)."
        required: false
        default: "false"
        type: choice
        options: ["true","false"]
      quote_chunk:
        description: "Workflow compatibility knob (accepted). Not used by hardened build (Tier A disabled)."
        required: false
        default: "120"

  schedule:
    # 01:30 UTC = 09:30 Australia/Perth (AWST)
    - cron: "30 1 * * *"

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build fundamentals snapshot
        env:
          MODE: ${{ inputs.mode }}
          SUMMARY_PER_RUN: ${{ inputs.summary_per_run }}
          CONCURRENCY: ${{ inputs.concurrency }}
          QS_RATE_PER_MIN: ${{ inputs.qs_rate_per_min }}
          MIN_SUCCESS_RATE: ${{ inputs.min_success_rate }}
          FAIL_ON_LOW_SUCCESS: ${{ inputs.fail_on_low_success }}
          INCLUDE_STATEMENTS: ${{ inputs.include_statements }}
          QUOTE_CHUNK: ${{ inputs.quote_chunk }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${INCLUDE_STATEMENTS}" = "true" ]; then
            EXTRA="--include_statements"
          fi

          python scripts/asx_fundamentals_snapshot.py             --repo-root .             --mode "${MODE:-rotate}"             --summary-per-run "${SUMMARY_PER_RUN:-220}"             --concurrency "${CONCURRENCY:-1}"             --qs-rate-per-min "${QS_RATE_PER_MIN:-8}"             --min-success-rate "${MIN_SUCCESS_RATE:-0.30}"             --fail-on-low-success "${FAIL_ON_LOW_SUCCESS:-true}"             --quote-chunk "${QUOTE_CHUNK:-120}"             $EXTRA

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add             asx/fundamentals_latest.json             asx/fundamentals_latest.csv             asx/fundamentals_latest.xlsx             asx/fundamentals_cache.json

          git commit -m "Update fundamentals latest" || echo "No changes to commit"
          git push
