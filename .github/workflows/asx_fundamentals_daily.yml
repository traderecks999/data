name: ASX Fundamentals (Daily)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rotate (default) refreshes a slice each run; full tries every eligible equity ticker"
        required: false
        default: "rotate"
      summary_per_run:
        description: "How many equity tickers to refresh in rotate mode"
        required: false
        default: "220"
      concurrency:
        description: "Parallel quoteSummary requests (lower is gentler on Yahoo)"
        required: false
        default: "4"
      min_success_rate:
        description: "If deep success rate is below this, cursor will NOT advance and (by default) the run fails"
        required: false
        default: "0.30"
      fail_on_low_success:
        description: "true/false: fail workflow when deep success rate < min_success_rate (recommended)"
        required: false
        default: "true"

  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily == 09:30 Australia/Perth

permissions:
  contents: write

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fundamentals snapshot
        env:
          TZ: Australia/Perth
        run: |
          python scripts/asx_fundamentals_snapshot.py \
            --mode "${{ inputs.mode || 'rotate' }}" \
            --summary_per_run "${{ inputs.summary_per_run || '220' }}" \
            --concurrency "${{ inputs.concurrency || '4' }}" \
            --min_success_rate "${{ inputs.min_success_rate || '0.30' }}" \
            --fail_on_low_success "${{ inputs.fail_on_low_success || 'true' }}"

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add asx/fundamentals_latest.json asx/fundamentals_latest.csv asx/fundamentals_latest.xlsx asx/fundamentals_cache.json
            git commit -m "Update ASX fundamentals snapshot"
            git push
          else
            echo "No changes to commit."
          fi
